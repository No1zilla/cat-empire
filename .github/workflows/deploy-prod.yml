name: Deploy Prod to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Все три деплоя пишут в одну ветку gh-pages и стартуют от одного пуша.
# Без общей очереди второй пуш прилетает поверх первого и падает отказом —
# именно так прод-сборка VK однажды не доехала. Очередь, а не отмена: каждая
# сборка нужна, просто по очереди.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for VK (prod)
        run: PLATFORM=vk npm run build

      - name: Copy index.html for VK iframe (no 301)
        run: cp dist/index.html dist/vk.html

      - name: Deploy to gh-pages (root)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: .
          keep_files: true
          commit_message: 'deploy: prod build from main'
