name: Deploy Telegram build to GitHub Pages

# Telegram-сборка живёт по своему пути: https://no1zilla.github.io/cat-empire/tg/
#
# Отдельный путь, а не общий с VK, по двум причинам.
# 1. С 20 июля 2026 Telegram запрещает вызовы методов Mini App с origin, отличного
#    от зарегистрированного домена приложения (Bot API 10.2). Origin здесь один и
#    тот же — github.io, — но URL, который вписывается в @BotFather, должен вести
#    ровно на эту сборку.
# 2. В сборку зашивается идентификатор рекламного блока Adsgram, которому нечего
#    делать в VK-версии.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      # ADSGRAM_BLOCK_ID задаётся в Settings → Secrets and variables → Actions → Variables.
      # Пока он пуст, игра честно сообщает, что рекламы нет, вместо пустого показа.
      - name: Build for Telegram
        env:
          VK_PAGES_BASE: /cat-empire/tg/
          ADSGRAM_BLOCK_ID: ${{ vars.ADSGRAM_BLOCK_ID }}
        run: npm run build:tg

      - name: Deploy to gh-pages (/tg)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: tg
          keep_files: true
          commit_message: 'deploy: telegram build from main'
