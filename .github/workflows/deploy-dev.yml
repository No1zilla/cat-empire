name: Deploy Dev to GitHub Pages

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for VK (dev)
        run: VK_PAGES_BASE=https://no1zilla.github.io/cat-empire/ PLATFORM=vk npm run build

      - name: Copy index.html for VK iframe (no 301)
        run: cp dist/index.html dist/vk.html

      - name: Deploy to gh-pages (/dev/ subfolder)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: dev
          keep_files: true
          commit_message: 'deploy: dev build from dev branch'

      - name: Create root /dev.html redirect fallback
        run: |
          mkdir -p redirect_dist
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=./dev/"><script>window.location.href="./dev/";</script></head><body><a href="./dev/">Click here if not redirected</a></body></html>' > redirect_dist/dev.html

      - name: Deploy dev.html redirect to root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./redirect_dist
          destination_dir: .
          keep_files: true
          commit_message: 'deploy: dev.html redirect fallback'
