<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Империя Котиков 🐱</title>
  <link rel="icon" href="./favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #100b20;
      font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }


    /* 🔥 Единый сочный Экран Загрузки в стиле MainMenu (TOKENS #0D0A1C) */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      background: #0d0a1c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-align: center;
      pointer-events: auto;
    }

    /* Фоновое глянцевое фиолетовое свечение в центре (1-в-1 с MainMenu) */
    #splash-screen::before {
      content: '';
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: rgba(61, 35, 117, 0.35);
      top: calc(50% - 40px);
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* Круглая карточка Маскота 1-в-1 как в MainMenu */
    .splash-icon-wrapper {
      position: relative;
      width: 144px;
      height: 144px;
      border-radius: 50%;
      background: #15102a;
      border: 3px solid #271f4f;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 2;
    }
    .splash-icon {
      width: 110px;
      height: 110px;
      object-fit: contain;
    }

    /* Единый Заголовок 1-в-1 с MainMenu */
    .splash-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #FFD15C !important;
      -webkit-text-fill-color: #FFD15C !important;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.9);
      margin-bottom: 4px;
      z-index: 10;
    }

    .splash-subtitle {
      font-size: 13px;
      color: #A855F7 !important;
      -webkit-text-fill-color: #A855F7 !important;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 28px;
      z-index: 10;
    }

    /* Прогресс-бар в едином токены-стиле */
    .progress-bar-container {
      width: 240px;
      height: 14px;
      background: #15102a;
      border-radius: 10px;
      border: 1.5px solid #271f4f;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
      margin-bottom: 14px;
      z-index: 2;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff6b6b 0%, #ffd15c 100%);
      border-radius: 8px;
      transition: width 0.3s ease;
      box-shadow: 0 0 12px rgba(255, 107, 107, 0.6);
      position: relative;
    }
    .progress-bar-fill::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.4) 50%, transparent 100%);
      animation: shimmer 1.5s infinite;
    }

    .splash-status {
      font-size: 12px;
      color: #6e6a8f;
      font-weight: 700;
      letter-spacing: 0.5px;
      animation: fadeInOut 1.5s infinite alternate;
      z-index: 2;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    @keyframes fadeInOut {
      0% { opacity: 0.5; }
      100% { opacity: 1.0; }
    }
  </style>
  <script>
    window.resetTutorial = function() {
      localStorage.removeItem('cat_empire_tutorial_done');
      console.log('🔄 Флаг туториала сброшен! Перезагружаем страницу...');
      location.reload();
    };
  </script>
  <script type="module" crossorigin src="./assets/index-BQGEDmFc.js"></script>
</head>
<body>
  <!-- 🔥 Единый Сплаш-Экран Загрузки в стиле MainMenu -->
  <div id="splash-screen">
    <div class="splash-icon-wrapper">
      <img class="splash-icon" src="./assets/cats/cat_12.png" alt="Империя Котиков">
    </div>
    <h1 class="splash-title">ИМПЕРИЯ КОТИКОВ</h1>
    <p class="splash-subtitle">IDLE MERGE KINGDOM</p>
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="splash-progress"></div>
    </div>
    <p class="splash-status" id="splash-status-text">Загрузка пушистой империи...</p>
  </div>

  <div id="game-container"></div>
</body>
</html>
